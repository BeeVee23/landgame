<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How is land actually used? — World Map</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --text:#18181b; --muted:#71717a; --border:#e4e4e7; --accent:#059669; --blue:#3b82f6; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); }
  .container { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  .subtitle { color:var(--muted); font-size:0.95rem; margin-bottom:18px; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  select { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:1rem; background:var(--card); }
  .btn { padding:8px 16px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:0.9rem; text-decoration:none; display:inline-block; }
  #map { width:100%; height:500px; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .tooltip { position:absolute; background:rgba(0,0,0,0.8); color:#fff; padding:6px 10px; border-radius:6px; font-size:0.85rem; pointer-events:none; opacity:0; transition:opacity 0.15s; }
  .links { margin-top:20px; text-align:center; }
  .links a { margin:0 10px; color:var(--blue); text-decoration:none; }
  .links a:hover { text-decoration:underline; }
  @media(max-width:600px){ #map{height:350px;} h1{font-size:1.25rem;} }
</style>
</head>
<body>
<div class="container">
  <h1>🌍 How is land actually used?</h1>
  <div class="subtitle">Click a country on the map or use the dropdown to play. Inspired by Dr. Simon Clark.</div>
  <div class="controls">
    <select id="countrySelect"><option value="">Select a country…</option></select>
    <a class="btn" href="stats.html">📊 Stats</a>
    <a class="btn" href="changelog.html">📝 Changelog</a>
  </div>
  <div id="map"></div>
  <div class="tooltip" id="tooltip"></div>
  <div class="links">
    <a href="https://www.youtube.com/@DrSimonClark" target="_blank">Dr. Simon Clark on YouTube</a>
  </div>
</div>

<script src="data.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script>
const width = document.getElementById('map').clientWidth;
const height = 500;
const svg = d3.select("#map").append("svg").attr("width", width).attr("height", height);
const projection = d3.geoEqualEarth().scale(width / 5.5).translate([width / 2, height / 2]);
const path = d3.geoPath().projection(projection);
const tooltip = d3.select("#tooltip");

// Populate dropdown
const sel = document.getElementById('countrySelect');
COUNTRY_LIST.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c.code; opt.textContent = `${c.flag} ${c.name}`;
  sel.appendChild(opt);
});
sel.addEventListener('change', e => { if(e.target.value) location.href = `game.html?c=${e.target.value}`; });

// Load world map
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  const countries = topojson.feature(world, world.objects.countries).features;
  const numericMap = {};
  COUNTRY_LIST.forEach(c => { const d = COUNTRIES[c.code]; if(d) numericMap[d.numeric] = c.code; });

  svg.selectAll("path")
    .data(countries)
    .enter().append("path")
    .attr("d", path)
    .attr("fill", d => numericMap[d.id] ? "#86efac" : "#e4e4e7")
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5)
    .style("cursor", d => numericMap[d.id] ? "pointer" : "default")
    .on("mouseover", function(event, d) {
      if (!numericMap[d.id]) return;
      const code = numericMap[d.id];
      const c = COUNTRIES[code];
      d3.select(this).attr("fill", "#22c55e");
      tooltip.style("opacity", 1).html(`${c.flag} ${c.name}`);
    })
    .on("mousemove", function(event) {
      tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 28) + "px");
    })
    .on("mouseout", function(event, d) {
      d3.select(this).attr("fill", numericMap[d.id] ? "#86efac" : "#e4e4e7");
      tooltip.style("opacity", 0);
    })
    .on("click", function(event, d) {
      const code = numericMap[d.id];
      if (code) location.href = `game.html?c=${code}`;
    });
}).catch(err => {
  document.getElementById('map').innerHTML = '<p style="padding:20px;color:#71717a">Map loading failed. Use the dropdown above to select a country.</p>';
});
</script>
</body>
</html>
