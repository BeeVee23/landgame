<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Landgame Stats</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --text:#18181b; --muted:#71717a; --border:#e4e4e7; --accent:#059669; --blue:#3b82f6; --red:#ef4444; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.55; }
  .container { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  .subtitle { color:var(--muted); font-size:0.95rem; margin-bottom:18px; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .statbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .statpill { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; text-align:center; flex:1; min-width:100px; }
  .statpill .num { font-size:1.4rem; font-weight:700; display:block; }
  .statpill .lbl { font-size:0.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  table { width:100%; border-collapse:collapse; font-size:0.92rem; }
  th, td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em; }
  .score { font-weight:700; }
  .score.high { color:var(--accent); }
  .score.mid { color:var(--blue); }
  .score.low { color:var(--red); }
  .progress-bar { height:8px; background:#e4e4e7; border-radius:4px; overflow:hidden; margin-top:4px; }
  .progress-fill { height:100%; background:var(--accent); border-radius:4px; }
  .btn { padding:8px 16px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:0.9rem; margin-top:12px; }
  .suggest { color:var(--muted); font-size:0.9rem; margin-top:8px; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Your Landgame Stats</h1>
  <div class="subtitle">Track your progress across all countries.</div>

  <div class="statbar">
    <div class="statpill"><span class="num" id="played">0</span><span class="lbl">Played</span></div>
    <div class="statpill"><span class="num" id="avg">0%</span><span class="lbl">Average</span></div>
    <div class="statpill"><span class="num" id="best">0%</span><span class="lbl">Best</span></div>
    <div class="statpill"><span class="num" id="progress">0%</span><span class="lbl">Completion</span></div>
  </div>

  <div class="box">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="box">
    <table id="scoreTable">
      <thead><tr><th>Country</th><th>Best Score</th><th>Date</th><th>Play</th></tr></thead>
      <tbody></tbody>
    </table>
    <button class="btn" onclick="clearData()">Clear all data</button>
  </div>

  <p style="text-align:center; margin-top:24px;"><a href="index.html">← Back to map</a></p>
</div>

<script src="data.js"></script>
<script>
function loadScores() {
  try { return JSON.parse(localStorage.getItem('landgame_scores') || '{}'); } catch(e) { return {}; }
}
function render() {
  const scores = loadScores();
  const entries = Object.entries(scores);
  const played = entries.length;
  const total = COUNTRY_LIST.length;
  const avg = played ? Math.round(entries.reduce((s,[,v])=>s+v.score,0)/played) : 0;
  const best = played ? Math.max(...entries.map(([,v])=>v.score)) : 0;

  document.getElementById('played').textContent = played + '/' + total;
  document.getElementById('avg').textContent = avg + '%';
  document.getElementById('best').textContent = best + '%';
  document.getElementById('progress').textContent = Math.round(played/total*100) + '%';
  document.getElementById('progressFill').style.width = (played/total*100) + '%';

  // Suggest next
  const unplayed = COUNTRY_LIST.filter(c => !scores[c.code]);
  if (unplayed.length) {
    const pick = unplayed[Math.floor(Math.random()*unplayed.length)];
    document.getElementById('suggest').innerHTML = `🎲 Next suggestion: <a href="game.html?c=${pick.code}">${pick.flag} ${pick.name}</a>`;
  } else {
    document.getElementById('suggest').textContent = '🎉 You have played every country!';
  }

  // Table
  const tbody = document.querySelector('#scoreTable tbody');
  tbody.innerHTML = '';
  COUNTRY_LIST.forEach(c => {
    const s = scores[c.code];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${c.flag} ${c.name}</td>
      <td class="score ${s?(s.score>=70?'high':s.score>=40?'mid':'low'):''}">${s?s.score+'%':'—'}</td>
      <td>${s?s.date:'—'}</td>
      <td><a href="game.html?c=${c.code}">Play →</a></td>
    `;
    tbody.appendChild(tr);
  });
}
function clearData() {
  if (confirm('Clear all saved scores?')) { localStorage.removeItem('landgame_scores'); render(); }
}
render();
</script>
</body>
</html>
