<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #ffffff; --bg-secondary: #f5f4f0; --bg-tertiary: #eeede8;
  --text-primary: #1a1a18; --text-secondary: #5f5e5a;
  --border: rgba(0,0,0,0.12); --border-md: rgba(0,0,0,0.22);
  --radius-md: 8px; --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1e1e1c; --bg-secondary: #2a2a27; --bg-tertiary: #313130;
    --text-primary: #f0ede6; --text-secondary: #a09e97;
    --border: rgba(255,255,255,0.10); --border-md: rgba(255,255,255,0.20);
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', var(--font-extra, 'Segoe UI'), Roboto, sans-serif; background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; padding: 2rem 1rem; }
.page { max-width: 720px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
.subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 0.75rem; line-height: 1.5; }
.disclaimer { font-size: 11px; color: var(--text-secondary); background: var(--bg-secondary); border-left: 3px solid var(--border-md); border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 0.6rem 0.9rem; margin-bottom: 1rem; line-height: 1.7; }
.disclaimer strong { color: var(--text-primary); }
.country-note { font-size: 11px; color: #6b4a1f; background: #fdf1de; border-left: 3px solid #e0a94a; border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 0.6rem 0.9rem; margin-bottom: 0.6rem; line-height: 1.7; }
@media (prefers-color-scheme: dark) { .country-note { color: #f0d9ae; background: #3a2f1a; border-left-color: #b8842e; } }
.country-note strong { color: inherit; }
.lang-toggle { font-family: inherit; font-size: 11px; padding: 3px 9px; background: var(--bg-primary); border: 0.5px solid var(--border-md); border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary); float: right; margin: 2px 0 0 8px; }
.lang-toggle:hover { background: var(--bg-secondary); color: var(--text-primary); }
.data-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.data-info { font-size: 11px; color: var(--text-secondary); flex: 1; min-width: 160px; }
.data-info strong { color: var(--text-primary); }
.score-bar { display: flex; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.metric { background: var(--bg-secondary); border-radius: var(--radius-md); padding: .6rem .9rem; flex: 1; min-width: 80px; }
.metric .lbl { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
.metric .val { font-size: 20px; font-weight: 500; }
.map-section { margin-bottom: 1.25rem; }
.map-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
#treemap { width: 100%; height: 200px; border-radius: var(--radius-md); overflow: hidden; display: flex; background: var(--bg-secondary); padding: 2px; gap: 2px; }
.tm-block { display: flex; align-items: center; justify-content: center; border-radius: 3px; transition: flex .4s ease; overflow: hidden; }
.tm-label { font-size: 11px; font-weight: 500; text-align: center; padding: 2px 3px; line-height: 1.3; pointer-events: none; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.legend { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1.1rem; }
.leg-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.leg-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.total-bar-wrap { margin-bottom: .75rem; }
.total-bar-track { height: 8px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
.total-bar-fill { height: 100%; border-radius: 4px; transition: width .2s ease, background .2s ease; max-width: 100%; }
.total-bar-label { font-size: 12px; color: var(--text-secondary); }
.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: .75rem; }
@media (max-width: 520px) { .cards-grid { grid-template-columns: 1fr; } }
.card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: .9rem; }
.solar-card { grid-column: 1 / -1; }
.card-head { display: flex; align-items: center; gap: 7px; margin-bottom: .4rem; }
.card-icon { font-size: 18px; }
.card-name { font-size: 13px; font-weight: 500; }
.card-desc { font-size: 11px; color: var(--text-secondary); margin-bottom: .6rem; line-height: 1.4; }
.sl-row { display: flex; align-items: center; gap: 8px; }
.sl-row input[type=range] { flex: 1; accent-color: var(--accent, #c4a96b); }
.sl-val { font-size: 13px; font-weight: 500; min-width: 50px; text-align: right; }
.solar-note { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.res-line { font-size: 11px; margin-top: 5px; min-height: 14px; display: none; line-height: 1.4; }
.readout-text { font-size: 12px; color: var(--text-secondary); }
.btn-row { display: flex; gap: 8px; margin-top: .5rem; }
#sub-btn { flex: 1; padding: 9px 16px; font-size: 14px; background: var(--bg-primary); border: 0.5px solid var(--border-md); border-radius: var(--radius-md); color: var(--text-primary); cursor: pointer; }
#sub-btn:hover:not(:disabled) { background: var(--bg-secondary); }
#sub-btn:disabled { opacity: .4; cursor: default; }
#rst-btn { padding: 9px 13px; font-size: 14px; background: var(--bg-primary); border: 0.5px solid var(--border-md); border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; display: none; }
#rst-btn:hover { background: var(--bg-secondary); }
.final { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 1rem; margin-top: .75rem; display: none; text-align: center; }
.final-num { font-size: 36px; font-weight: 500; }
.final-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.final-grade { font-size: 15px; font-weight: 500; margin-top: 6px; }
.world-card { background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary)); border: 0.5px solid var(--border-md); border-radius: var(--radius-lg); padding: 1.1rem; margin-top: .75rem; }
.world-head { font-size: 15px; font-weight: 500; margin-bottom: .5rem; }
.world-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: .75rem; }
.world-text strong { color: var(--text-primary); }
.geo-maps-row { display: flex; gap: 8px; margin-bottom: .6rem; }
#world-geo-map { flex: 1.4; height: 280px; border-radius: 8px; overflow: hidden; background: #0d1b2a; }
#world-geo-map svg { width: 100%; height: 100%; display: block; }
#world-geo-inset { flex: 1; height: 280px; border-radius: 8px; overflow: hidden; background: #16283c; position: relative; }
#world-geo-inset svg { width: 100%; height: 100%; display: block; }
.geo-inset-label { position: absolute; top: 6px; left: 8px; font-size: 9.5px; color: var(--text-secondary); background: rgba(13,27,42,0.7); padding: 2px 6px; border-radius: 4px; }
.geo-land { fill: #2a3f54; stroke: #0d1b2a; stroke-width: 0.4; }
.geo-country { fill: #8a7860; stroke: #f5f2eb; stroke-width: 0.6; opacity: 0.65; }
.geo-circle { fill: #EF9F27; fill-opacity: 0.85; stroke: #fff; stroke-width: 1; stroke-dasharray: 3,2; }
.geo-legend { display: flex; gap: 14px; font-size: 10.5px; color: var(--text-secondary); margin-bottom: .5rem; flex-wrap: wrap; }
.geo-legend span { display: inline-flex; align-items: center; gap: 4px; }
.geo-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.world-foot { font-size: 11px; color: var(--text-secondary); line-height: 1.5; font-style: italic; }
.source { font-size: 11px; color: var(--text-secondary); margin-top: 1.5rem; line-height: 1.8; }
.source a { color: var(--text-secondary); text-decoration: underline; }
:lang(th) .subtitle { line-height: 1.6; }
:lang(th) .disclaimer, :lang(th) .country-note { line-height: 1.8; }
:lang(th) .card-desc, :lang(th) .res-line { line-height: 1.5; }
:lang(th) .world-text { line-height: 1.7; }
:lang(th) .world-foot { line-height: 1.6; }
</style>

<body>
<div class="page">
  <button class="lang-toggle" id="lang-btn">English</button>
  <h1 id="h1-el"></h1>
  <p class="subtitle" id="subtitle-el"></p>
  <div class="country-note" id="country-note-el"></div>
  <div class="disclaimer" id="disclaimer-el"></div>
  <div class="data-bar">
    <span class="data-info" id="data-info-el"></span>
  </div>
  <div class="score-bar">
    <div class="metric"><div class="lbl" id="lbl-score">Score</div><div class="val" id="score-v">0%</div></div>
    <div class="metric"><div class="lbl" id="lbl-land">Land used</div><div class="val" id="total-v">0%</div></div>
    <div class="metric"><div class="lbl" id="lbl-remain">Remaining</div><div class="val" id="remain-v">100%</div></div>
  </div>
  <div class="map-section">
    <div class="map-title" id="map-title">Your guesses — proportional area map (updates as you slide)</div>
    <div id="treemap"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="total-bar-wrap">
    <div class="total-bar-track"><div class="total-bar-fill" id="tot-fill" style="width:0%;background:#c4a96b"></div></div>
    <div class="total-bar-label" id="tot-label">0 / 100% allocated</div>
  </div>
  <div class="cards-grid" id="cards"></div>
  <div class="btn-row">
    <button id="sub-btn">Submit all guesses</button>

  </div>

    <div class="final-num" id="final-n">0%</div>
    <div class="final-sub" id="final-sub">accuracy score</div>
    <div class="final-grade" id="final-g"></div>
  </div>
  <div class="world-card" id="world-card" style="display:none">
    <div class="world-head" id="world-head"></div>
    <p class="world-text" id="world-text"></p>
    <p class="world-text" id="world-text2" style="margin-bottom:.75rem"></p>
    <div class="geo-legend" id="geo-legend"></div>
    <div class="geo-maps-row">
      <div id="world-geo-map"></div>
      <div id="world-geo-inset"></div>
    </div>
    <p class="world-foot" id="world-foot"></p>
  </div>
  <p class="source" id="source-el"></p>

<script>
/* Landgame engine v6 — one shared game engine; per-country content lives in data-<cc>.js */
(function(){
'use strict';
const qs=new URLSearchParams(location.search);
const CC=(qs.get('c')||location.hash.replace('#','')||'').toLowerCase().replace(/[^a-z]/g,'');
const $=id=>document.getElementById(id);

function fail(msg){
  document.querySelector('.page').innerHTML='<p style="padding:2rem 0;color:var(--text-secondary)">'+msg+'</p>';
}
if(!CC){ fail('No country selected.'); return; }
const sc=document.createElement('script');
sc.src='data-'+CC+'.js';
sc.onload=function(){ const D=(window.LANDGAME||{})[CC]; if(D) start(D); else fail('Country data not found.'); };
sc.onerror=function(){ fail('Could not load data for “'+CC+'”.'); };
document.head.appendChild(sc);

function start(D){
const LANGS=D.langs;
const STRINGS=D.strings, WORLD_STRINGS=D.world, CATS_BY=D.cats;
const COUNTRY_LON=D.lon, COUNTRY_LAT=D.lat, COUNTRY_ISO=D.iso, COUNTRY_HA=D.ha;
const SOL100_HA=D.sol100Ha, DEMAND_TWH=D.demandTwh, WORLD_DEMAND_TWH=D.worldDemand||31000;
const HA_PER_TWH=SOL100_HA/DEMAND_TWH;

let currentLang=LANGS[0], submitted=false, totalScore=0;
let CATS=[...CATS_BY[currentLang]], MAIN_CATS=CATS.filter(c=>!c.readOnly);

// ---- static page chrome from data ----
document.title=D.title;
if(D.accent) document.documentElement.style.setProperty('--accent',D.accent);
if(D.fontExtra) document.documentElement.style.setProperty('--font-extra',D.fontExtra);
$('data-info-el').innerHTML=D.dataInfo;
$('source-el').innerHTML=D.sources;
const ACC=(D.accent||'#c4a96b').replace('#','');
const ACC_RGB=[0,2,4].map(i=>parseInt(ACC.substr(i,2),16));
$('tot-fill').style.background=D.accent||'#c4a96b';
if(LANGS.length<2) $('lang-btn').style.display='none';
else $('lang-btn').addEventListener('click',toggleLang);

function applyLang(lang){
  const s=STRINGS[lang];
  CATS=[...CATS_BY[lang]];
  MAIN_CATS=CATS.filter(c=>!c.readOnly);
  document.documentElement.lang=lang;
  $('h1-el').innerHTML=s.h1;
  $('subtitle-el').innerHTML=s.subtitle;
  const dis=$('disclaimer-el'); dis.innerHTML=s.disclaimer?'<strong>'+s.noteLabel+':</strong> '+s.disclaimer:''; dis.style.display=s.disclaimer?'':'none';
  const cn=$('country-note-el'); cn.innerHTML=s.countryNote?'<strong>'+s.contextLabel+':</strong> '+s.countryNote:''; cn.style.display=s.countryNote?'':'none';
  $('lbl-score').textContent=s.score;
  $('lbl-land').textContent=s.land_used;
  $('lbl-remain').textContent=s.remaining;
  if(!submitted) buildCards();
  const sb=$('sub-btn'); if(sb&&!sb.disabled) sb.textContent=s.submit;
  const rb=$('rst-btn'); if(rb) rb.innerHTML='<i class="ti ti-refresh"></i> '+s.play_again;
  const mt=$('map-title'); if(mt) mt.textContent=submitted?s.map_answer:s.map_guess;
  const tl=$('tot-label'); if(tl){ const p=tl.textContent.split('/')[0].trim(); tl.textContent=p+' '+s.allocated; }
  const h=$('rl-hint-sol100'); if(h&&h.style.display!=='none') h.textContent=s.reveal;
  $('final-sub').textContent=s.out_of;
  if(submitted) $('final-g').textContent=gradeLabel(parseInt($('final-n').textContent,10));
  if(LANGS.length>1) $('lang-btn').textContent=s.btn_label;
  if($('world-card').style.display==='block') renderWorldCard();
  drawMap();
}
function toggleLang(){ currentLang=LANGS[(LANGS.indexOf(currentLang)+1)%LANGS.length]; applyLang(currentLang); }

function dpOf(cat){ return cat.dp!==undefined?cat.dp:(cat.isSolar?3:1); }
// display precision for a value shown in results/legend: tiny values (<0.01) always get 4 decimals
function dpFor(cat,v){ return v<0.01?4:dpOf(cat); }
function getVal(cat){
  if(cat.readOnly) return 0;
  const el=$('sl-'+cat.id);
  return el?parseFloat(el.value):0;
}
function getMainTotal(){ return MAIN_CATS.reduce((s,c)=>s+getVal(c),0); }
function clampAll(changedId){
  const total=MAIN_CATS.reduce((s,c)=>{const el=$('sl-'+c.id);return s+(el?parseFloat(el.value):0);},0);
  const over=total-100; if(over<=0.0001) return;
  const others=MAIN_CATS.filter(c=>c.id!==changedId);
  const ot=others.reduce((s,c)=>{const el=$('sl-'+c.id);return s+(el?parseFloat(el.value):0);},0);
  if(ot<=0) return;
  let rem=over;
  others.forEach((cat,i)=>{
    const el=$('sl-'+cat.id); if(!el) return;
    const cur=parseFloat(el.value);
    const share=(i===others.length-1)?rem:Math.min(cur,(cur/ot)*over);
    const nv=Math.max(0,parseFloat((cur-share).toFixed(5)));
    rem-=(cur-nv); el.value=nv;
    $('sv-'+cat.id).textContent=nv.toFixed(dpOf(cat))+'%';
  });
}
function updateTotal(){
  const t=getMainTotal(); const tD=Math.min(t,100);
  $('total-v').textContent=tD.toFixed(1)+'%';
  $('remain-v').textContent=Math.max(0,100-t).toFixed(1)+'%';
  const fill=$('tot-fill');
  fill.style.width=tD+'%';
  const p=tD/100;
  fill.style.background='rgb('+Math.round(ACC_RGB[0]*p+59*(1-p))+','+Math.round(ACC_RGB[1]*p+153*(1-p))+','+Math.round(ACC_RGB[2]*p+17*(1-p))+')';
  $('tot-label').textContent=tD.toFixed(1)+' '+STRINGS[currentLang].allocated;
}
function drawMap(){
  const tm=$('treemap');
  let cats=submitted
    ?[...CATS.filter(c=>!c.readOnly).map(c=>({...c,pct:c.answer})),...CATS.filter(c=>c.readOnly).map(c=>({...c,pct:c.answer}))]
    :MAIN_CATS.map(c=>({...c,pct:getVal(c)}));
  cats=cats.filter(c=>c.pct>0).sort((a,b)=>b.pct-a.pct);
  const total=cats.reduce((s,c)=>s+c.pct,0)||1;
  tm.innerHTML='';
  cats.forEach(cat=>{
    const block=document.createElement('div'); block.className='tm-block';
    const dp=dpFor(cat,cat.pct);
    const pctStr=cat.pct.toFixed(cat.pct<0.01?dp:1);
    block.title=cat.name+': '+pctStr+'%';
    block.style.cssText='background:'+cat.color+';flex:'+cat.pct+' 1 0%;min-width:2px;height:100%';
    const estW=(cat.pct/total)*(tm.clientWidth||680);
    if(estW>22){ const lbl=document.createElement('div'); lbl.className='tm-label'; lbl.innerHTML=estW>44?cat.icon+'<br>'+pctStr+'%':cat.icon; block.appendChild(lbl); }
    tm.appendChild(block);
  });
  $('legend').innerHTML=cats.map(c=>{
    const pctStr=c.pct.toFixed(c.pct<0.01?dpFor(c,c.pct):1);
    return '<span class="leg-item"><span class="leg-dot" style="background:'+c.color+'"></span>'+c.name+' '+pctStr+'%</span>';
  }).join('');
}
function buildCards(){
  const container=$('cards'); container.innerHTML='';
  CATS.forEach(cat=>{
    const div=document.createElement('div');
    div.className='card'+(cat.isSolar?' solar-card':'');
    if(cat.readOnly){
      div.innerHTML='<div class="card-head"><span class="card-icon">'+cat.icon+'</span><span class="card-name">'+cat.name+'</span></div>'+
        '<div class="card-desc">'+cat.desc+'</div>'+
        '<div class="readout-text" id="rl-hint-sol100">'+STRINGS[currentLang].reveal+'</div>'+
        '<div class="res-line" id="rl-sol100"></div>';
    } else {
      const dp=dpOf(cat);
      const existingEl=$('sl-'+cat.id);
      const curVal=existingEl?parseFloat(existingEl.value):0;
      div.innerHTML='<div class="card-head"><span class="card-icon">'+cat.icon+'</span><span class="card-name">'+cat.name+'</span></div>'+
        '<div class="card-desc">'+cat.desc+'</div>'+
        '<div class="sl-row">'+
          '<input type="range" min="0" max="'+cat.max+'" step="'+cat.step+'" value="'+curVal+'" id="sl-'+cat.id+'" aria-label="'+cat.name+'">'+
          '<span class="sl-val" id="sv-'+cat.id+'">'+curVal.toFixed(dp)+'%</span>'+
        '</div>'+
        (cat.isSolar&&cat.solarNote?'<div class="solar-note">'+cat.solarNote+'</div>':'')+
        '<div class="res-line" id="rl-'+cat.id+'"></div>';
    }
    container.appendChild(div);
    if(!cat.readOnly){
      $('sl-'+cat.id).addEventListener('input',function(){
        const dp=dpOf(cat);
        $('sv-'+cat.id).textContent=parseFloat(this.value).toFixed(dp)+'%';
        clampAll(cat.id);
        $('sv-'+cat.id).textContent=parseFloat($('sl-'+cat.id).value).toFixed(dp)+'%';
        updateTotal(); drawMap();
      });
    }
  });
}
function scoreGuess(guess,answer,step,catMax){
  const diff=Math.abs(guess-answer);
  if(step!==undefined && diff<=step*1.5) return 100;
  const frac=catMax?diff/catMax:Math.abs(diff/(answer||1));
  if(frac<=0.06) return 100;
  if(frac<=0.15) return Math.round(100-(frac-0.06)/0.09*50);
  if(frac<=0.40) return Math.round(50-(frac-0.15)/0.25*40);
  return Math.max(0,Math.round(10-(frac-0.40)*8));
}
function gradeLabel(s){
  const labels=STRINGS[currentLang].grades;
  for(const [t,l] of labels){ if(s>=t) return l; }
  return labels[labels.length-1][1];
}
function fmtAns(cat,dp){
  const r=Math.round(cat.answer*100)/100;
  const dec=((String(r).split('.')[1])||'').length;
  return cat.answer.toFixed(Math.max(dp,dec));
}
function haLabel(cat){
  const ha=cat.answerHa;
  if(!(ha>0)) return '';
  return ' (~'+(ha>=1000000?(ha/1000000).toFixed(1)+'M':ha>=10000?Math.round(ha/1000)+'k':Math.round(ha).toLocaleString('en'))+' ha)';
}
$('sub-btn').addEventListener('click',function(){
  if(submitted) return;
  submitted=true; totalScore=0;
  document.querySelector('.map-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  CATS.forEach(cat=>{
    const rl=$('rl-'+cat.id); if(!rl) return;
    rl.style.display='block';
    const dp=dpFor(cat,cat.answer);
    if(cat.readOnly){
      const hint=$('rl-hint-sol100'); if(hint) hint.style.display='none';
      rl.innerHTML='<span style="color:var(--text-secondary)">Answer: <strong style="color:#BA7517">'+fmtAns(cat,dp)+'%</strong>'+haLabel(cat)+' — '+STRINGS[currentLang].sol100_reveal+'</span>';
      return;
    }
    const guess=getVal(cat); const pts=scoreGuess(guess,cat.answer,cat.step,cat.max);
    totalScore+=pts;
    const diff=guess-cat.answer; const sign=diff>=0?'+':'';
    const diffStr=Math.abs(diff)<cat.step*1.5?'spot on!':sign+diff.toFixed(dp)+'% off';
    const col=pts>=80?'#3b6d11':pts>=40?'#ba7517':'#a32d2d';
    rl.innerHTML='<span style="color:var(--text-secondary)">Answer: <strong style="color:var(--text-primary)">'+fmtAns(cat,dp)+'%</strong>'+haLabel(cat)+'</span> <span style="color:'+col+';font-weight:500">'+diffStr+' → '+pts+'pts</span>';
    const sl=$('sl-'+cat.id); if(sl) sl.disabled=true;
  });
  const maxScore=MAIN_CATS.length*100;
  const scorePct=Math.round((totalScore/maxScore)*100);
  $('score-v').textContent=scorePct+'%';
  $('map-title').textContent=STRINGS[currentLang].map_answer;
  $('final').style.display='block';
  $('final-n').textContent=scorePct+'%';
  $('final-g').textContent=gradeLabel(scorePct);
  $('rst-btn').style.display='inline-flex';
  this.disabled=true; drawMap(); renderWorldCard();
});
$('rst-btn').addEventListener('click',function(){
  submitted=false; totalScore=0;
  CATS=[...CATS_BY[currentLang]];
  MAIN_CATS=CATS.filter(c=>!c.readOnly);
  $('score-v').textContent='0%';
  $('total-v').textContent='0%';
  $('remain-v').textContent='100%';
  $('final').style.display='none';
  $('world-card').style.display='none';
  $('map-title').textContent=STRINGS[currentLang].map_guess;
  $('tot-fill').style.width='0%';
  $('tot-label').textContent='0 '+STRINGS[currentLang].allocated;
  this.style.display='none';
  $('sub-btn').disabled=false;
  buildCards(); updateTotal(); setTimeout(drawMap,50);
});

function fmtHaM(haNeeded,W,lang){
  if(W.haStyle==='word'){
    const mw=(W.millionWord&&W.millionWord[lang])||'million';
    return haNeeded>=1e6?(haNeeded/1e6).toFixed(0)+' '+mw:Math.round(haNeeded/1000).toLocaleString()+',000';
  }
  return (haNeeded/1e6).toFixed(1);
}
function renderWorldCard(){
  const wc=$('world-card');
  wc.style.display='block';
  const W=WORLD_STRINGS, T=W[currentLang], S=STRINGS[currentLang];
  const haNeeded=WORLD_DEMAND_TWH*HA_PER_TWH;
  const pctNum=haNeeded/COUNTRY_HA*100;
  const pct=pctNum.toFixed(1);
  const haM=fmtHaM(haNeeded,W,currentLang);
  const multN=haNeeded/COUNTRY_HA;
  const mult=multN>=100?Math.round(multN).toLocaleString():multN.toFixed(1);
  $('world-head').textContent=T.head;
  const tpl=(T.overflow&&pctNum>100)?T.overflow:T.fit;
  $('world-text').innerHTML=tpl.replace(/\{haM\}/g,haM).replace(/\{pct\}/g,pct).replace(/\{mult\}/g,mult);
  $('world-text2').textContent=T.stat2||'';
  $('world-text2').style.display=T.stat2?'':'none';
  $('geo-legend').innerHTML=
    '<span><span class="geo-dot" style="background:#8a7860;opacity:0.65"></span>'+S.country_label+'</span>'+
    '<span><span class="geo-dot" style="background:#EF9F27"></span>'+S.circle_label+'</span>';
  $('world-foot').textContent=T.foot;
  setTimeout(()=>{drawGeoMap(haNeeded);drawGeoInset(haNeeded);},800);
}

let _worldTopo=null;
async function getWorldTopo(){
  if(_worldTopo) return _worldTopo;
  const r=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
  _worldTopo=await r.json(); return _worldTopo;
}
async function drawGeoMap(haNeeded){
  const topo=await getWorldTopo();
  const cont=$('world-geo-map'); cont.innerHTML='';
  const W=cont.clientWidth||440,H=280,R=H*0.62;
  const svg=d3.select(cont).append('svg').attr('viewBox','0 0 '+W+' '+H);
  const projection=d3.geoOrthographic().scale(R).translate([W/2,H/2]).rotate([-COUNTRY_LON,-COUNTRY_LAT]).clipAngle(90);
  const path=d3.geoPath(projection);
  svg.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#16283c');
  svg.append('path').datum(d3.geoGraticule()()).attr('d',path).attr('fill','none').attr('stroke','#22384f').attr('stroke-width',0.4);
  const land=topojson.feature(topo,topo.objects.countries);
  svg.append('g').selectAll('path').data(land.features).join('path').attr('class','geo-land').attr('d',path);
  const cf=land.features.find(f=>String(f.id).padStart(3,'0')===COUNTRY_ISO);
  if(cf) svg.append('path').datum(cf).attr('class','geo-country').attr('d',path);
  const aKm2=haNeeded/100,rKm=Math.sqrt(aKm2/Math.PI),angRad=(rKm/6371)*(180/Math.PI);
  svg.append('path').datum(d3.geoCircle().center([COUNTRY_LON,COUNTRY_LAT]).radius(angRad)()).attr('class','geo-circle').attr('d',path);
  let _angle=0;
  const _timer=d3.interval(()=>{
    _angle+=0.4;
    projection.rotate([-COUNTRY_LON-_angle,-COUNTRY_LAT]);
    svg.selectAll('.geo-land,.geo-country,.geo-circle').attr('d',path);
    if(_angle>360) _timer.stop();
  },40);
}
async function drawGeoInset(haNeeded){
  const topo=await getWorldTopo();
  const cont=$('world-geo-inset'); cont.innerHTML='';
  const W=cont.clientWidth||300,H=280;
  const aKm2=haNeeded/100,rKm=Math.sqrt(aKm2/Math.PI),angRad=(rKm/6371)*(180/Math.PI);
  const targetPR=H*0.30,scale=(180/Math.PI)/(angRad/targetPR)/2;
  const svg=d3.select(cont).append('svg').attr('viewBox','0 0 '+W+' '+H);
  const proj=d3.geoMercator().center([COUNTRY_LON,COUNTRY_LAT]).scale(scale).translate([W/2,H/2]);
  const path=d3.geoPath(proj);
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#16283c');
  svg.append('path').datum(d3.geoGraticule().step([5,5])()).attr('d',path).attr('fill','none').attr('stroke','#22384f').attr('stroke-width',0.4);
  const land=topojson.feature(topo,topo.objects.countries);
  svg.append('g').selectAll('path').data(land.features).join('path').attr('class','geo-land').attr('d',path);
  const cf=land.features.find(f=>String(f.id).padStart(3,'0')===COUNTRY_ISO);
  if(cf) svg.append('path').datum(cf).attr('class','geo-country').attr('d',path);
  svg.append('path').datum(d3.geoCircle().center([COUNTRY_LON,COUNTRY_LAT]).radius(angRad)()).attr('class','geo-circle').attr('d',path);
  const niceSteps=[10,25,50,100,200,500];
  let barKm=niceSteps.find(s=>s>=rKm*0.4)||500;
  const [x0]=proj([COUNTRY_LON,COUNTRY_LAT]);
  const [x1]=proj([COUNTRY_LON+barKm/111.32,COUNTRY_LAT]);
  const barPx=Math.abs(x1-x0);
  const g=svg.append('g');
  g.append('rect').attr('x',8).attr('y',H-26).attr('width',barPx).attr('height',2.5).attr('fill','#fff');
  g.append('text').attr('x',8).attr('y',H-12).attr('fill','#fff').attr('font-size',10).attr('style','text-shadow:0 1px 2px rgba(0,0,0,.6)').text(barKm.toLocaleString()+' km');
  const lbl=document.createElement('div'); lbl.className='geo-inset-label'; lbl.textContent=STRINGS[currentLang].zoomed;
  cont.style.position='relative'; cont.appendChild(lbl);
}

buildCards(); updateTotal(); setTimeout(drawMap,50); applyLang(currentLang);
window.addEventListener('resize',drawMap);
}
})();
</script>
